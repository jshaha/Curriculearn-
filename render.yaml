services:
  # Backend API (Python/Flask) - FREE TIER
  - type: web
    name: curriculearn-api
    runtime: python
    plan: free  # FREE TIER (spins down after 15min inactivity)
    buildCommand: pip install -r requirements.txt
    # --threads lets the single worker answer /health while an inference request
    # is running on another thread (threads share the already-loaded model, so
    # this adds almost no memory). Without it, Render's 5s health check times out
    # during the ~9s CPU-throttled inference and restarts the instance.
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 backend.api_server:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.4"
      - key: FLASK_DEBUG
        value: "false"
      - key: USE_CLAUDE_AGENTS
        value: "true"  # set to "true" after adding ANTHROPIC_API_KEY below
      # Add your Anthropic API key in the Render dashboard to enable Claude agents:
      - key: ANTHROPIC_API_KEY
        sync: false  # Manual entry in dashboard (secret)
    healthCheckPath: /health

  # Frontend (Next.js) - FREE TIER
  - type: web
    name: curriculearn-frontend
    runtime: node
    plan: free  # FREE TIER (spins down after 15min inactivity)
    buildCommand: cd frontend-next && npm install && npm run build
    startCommand: cd frontend-next && npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      # NEXT_PUBLIC_* vars are baked in at build time. Pull the backend host
      # from the API service automatically (the client prepends https://).
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: curriculearn-api
          property: host
      # Supabase (Postgres + anonymous auth). The publishable/anon key is safe
      # to expose in client bundles; row-level security enforces per-user access.
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: "https://hjjixpgxmiswnkjzbtgw.supabase.co"
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        value: "sb_publishable_3EPkp8H3avOUSPvxt7ywaA_gvyD00hL"
